<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Meowdoku｜貓咪數獨</title>
  <meta name="description" content="在每行、每列及每個顏色區域找出唯一的貓咪，挑戰 6×6 至 12×12 的 Meowdoku 邏輯謎題。">
  <link rel="stylesheet" href="styles.css">
  <link id="theme-css" rel="stylesheet" href="themes/default.css">
  <link rel="stylesheet" href="themes/cell-styles.css">
  <link rel="icon" type="image/webp" href="themes/cell-style-images/original.webp">
</head>

<body>
  <header class="app-header">
    <h1><img class="brand-cat" src="themes/cell-style-images/original.webp" width="64" height="64" alt="">Meowdoku</h1>
  </header>

  <main id="app">
    <section id="screen-select" class="screen">
      <h2>方塊樣式</h2>
      <div id="cell-style-buttons" class="button-grid style-button-grid">
        <button type="button" class="cell-style-button" data-cell-style="original">原始風格</button>
        <button type="button" class="cell-style-button" data-cell-style="glass">玻璃風格</button>
        <button type="button" class="cell-style-button" data-cell-style="pixel">像素風格</button>
        <button type="button" class="cell-style-button" data-cell-style="tile">磁磚風格</button>
        <button type="button" class="cell-style-button" data-cell-style="paper">紙牌風格</button>
        <button type="button" class="cell-style-button" data-cell-style="neon">霓虹風格</button>
      </div>

      <h2>選擇盤面大小</h2>
      <div id="size-buttons" class="button-grid"></div>

      <h2>選擇階段</h2>
      <div id="stage-buttons" class="button-grid"></div>

      <h2 id="level-heading" class="hidden">選擇關卡</h2>
      <div id="level-buttons" class="button-grid hidden"></div>
    </section>

    <section id="screen-game" class="screen hidden">
      <div class="game-toolbar">
        <button id="btn-back">← 返回</button>
        <span id="game-title"></span>
        <span id="hearts" class="hearts"></span>
      </div>
      <div class="game-toolbar tool-row">
        <button id="btn-restart">重來</button>
        <button id="btn-toggle-sound" class="tool-toggle">音效 🔊</button>
        <button id="btn-toggle-vibrate" class="tool-toggle">振動 📳</button>
        <button id="btn-toggle-auto" class="tool-toggle">自動排除</button>
        <button id="btn-toggle-hypo" class="tool-toggle hypo-tool"><span class="hypo-tool-label">假設</span><span class="hypo-tool-icon" aria-hidden="true"></span></button>
        <button id="btn-help" class="tool-toggle">說明</button>
      </div>
      <div id="board" class="board"></div>
      <div id="status-banner" class="status-banner hidden"></div>

      <div id="win-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <div class="modal-emoji">🎉</div>
          <div class="modal-title">完成！</div>
          <div id="win-time" class="win-time hidden"></div>
          <div class="modal-buttons">
            <button id="btn-modal-back" class="secondary">選關</button>
            <button id="btn-replay" class="secondary">重玩</button>
            <button id="btn-next-level">下一關</button>
          </div>
        </div>
      </div>
      <div id="help-modal" class="modal-overlay hidden">
        <div class="modal-box">
          <img class="modal-cat" src="themes/cell-style-images/original.webp" width="64" height="64" alt="Meowdoku 貓咪">
          <div class="modal-title" style="font-size:1.1rem;margin-bottom:16px">遊戲說明</div>
          <div class="help-content">
            <h3>規則</h3>
            <ul>
              <li>每行一隻貓、每列一隻貓</li>
              <li>兩隻貓不能相鄰（含斜角）</li>
              <li>每個顏色區域恰好一隻貓</li>
            </ul>
            <h3>操作</h3>
            <ul>
              <li><b>點一下</b>：打叉標記 / 取消</li>
              <li><b>快速點兩下</b>：猜這格有貓（答錯扣一顆心）</li>
              <li><b>按住拖曳</b>：整排塗成同狀態</li>
            </ul>
          </div>
          <div class="modal-buttons">
            <button id="btn-help-close">關閉</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="random-generator.js"></script>
  <script src="game.js"></script>
</body>

</html>
